name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The hosted runner has Visual Studio and the Windows SDK, so the watchdog is built with Native AOT.
      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: Desko
          path: dist/
